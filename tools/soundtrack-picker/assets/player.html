<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f0e9"><title>Soundtrack Picker</title>
<style>
:root{color-scheme:light dark;--paper:light-dark(#f7f0e9,#201d23);--ink:light-dark(#382d3b,#f1e8ee);--soft:light-dark(#655967,#c5b8c5);--line:light-dark(#d9cbd2,#524651);--accent:light-dark(#653b62,#e0b2d6);--panel:light-dark(#fffaf5,#2b252e);--selected:light-dark(#e8d9e5,#4b3549)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:38px 24px 70px}h1{font:400 clamp(34px,6vw,54px)/1.15 Georgia,serif;margin:20px 0;letter-spacing:-1px}h2{font:400 26px/1.3 Georgia,serif;margin:30px 0 16px}p{margin:12px 0 20px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--soft)}.intro{color:var(--soft);max-width:650px}.player{padding:24px;background:var(--panel);border-radius:10px;margin:26px 0}audio{width:100%;display:block;margin:16px 0}a{color:var(--accent);text-underline-offset:3px}.row,.chapters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.small{font-size:13px;color:var(--soft)}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:6px;min-height:44px}button[aria-pressed=true]{background:var(--selected);border-color:var(--accent)}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,audio:focus-visible{outline:3px solid var(--accent);outline-offset:3px}ul{padding-left:22px}li{margin:8px 0}details{border-top:1px solid var(--line);margin-top:26px;padding-top:12px}summary{cursor:pointer;padding:8px 0}footer{border-top:1px solid var(--line);margin-top:34px;padding-top:18px}#status{min-height:22px}@media(max-width:420px){main{padding:24px 18px 50px}.player{padding:16px}}
</style></head><body><main>
<div class="eyebrow" id="eyebrow"></div><nav id="languages" class="row" aria-label="Language"></nav>
<h1 id="title"></h1><p class="intro" id="intro"></p>
<section class="player" aria-label="Full story player"><strong id="mix-label"></strong><p class="small" id="duration"></p><audio id="full-audio" controls preload="metadata" playsinline></audio><div class="row"><a id="download" download></a><button id="restart" type="button"></button></div><p class="small" id="status" aria-live="polite"></p></section>
<h2 id="chapter-title"></h2><nav class="chapters" id="chapters" aria-label="Chapters"></nav>
<section id="closing-section"><h2 id="closing-title"></h2><p id="closing-description"></p><audio id="closing-audio" controls preload="none" playsinline></audio><p class="small"><a id="closing-download" download></a></p></section>
<p class="small"><a id="comparison"></a></p><details><summary id="credits-title"></summary><ul id="credits"></ul><p class="small" id="edit-notice"></p></details>
<footer><p class="small" id="footer"></p></footer>
</main><script>
const data=__PLAYER_DATA__;
const $=id=>document.getElementById(id),audio=$('full-audio'),closing=$('closing-audio');
let edition=null,generation=0,buffered=false,buffering=null,controller=null,blobURL=null,requestedTime=null,lastSave=0;
const languageKey='soundtrack-picker-language-'+data.title;
const ui={en:{intro:'The whole story, with your selected music and a joyful closing. Subtle beneath the voices, opening up between chapters.',mix:'Canonical soundtrack · v1',duration:'English narration · Stereo',download:'Download English MP3',restart:'Start from the beginning',ready:'Press play to listen to the complete arc.',chapter:'Jump to a chapter',closing:'The joyful closing',closingDescription:'The brighter orchestration brings the opening theme home. The final words stay exposed, then the music finishes.',closingDownload:'Download the closing',comparison:'Compare the scene auditions',credits:'Music credits',edits:'Music edited for this story: excerpts, fades, EQ, speech ducking, and synchronization with narration. Music licenses apply to the music; text and illustrations retain their own rights.',footer:'Playback position stays in this browser. The English and Spanish versions use the same musical choices, timed to each narration.',preparing:'Preparing the full story',playing:'Playing the complete story.',resuming:'Ready at your last listening position. Press play to continue.',error:'Audio could not load. Refresh the page or download the MP3.',seekError:'Please use Download MP3 to listen and jump between chapters.'},es:{intro:'El cuento completo, con la música elegida y un cierre alegre. Sutil debajo de las voces, con espacio para brillar entre capítulos.',mix:'Banda sonora canónica · v1',duration:'Narración en español · Estéreo',download:'Descargar MP3 en español',restart:'Empezar desde el principio',ready:'Pulsa reproducir para escuchar el cuento completo.',chapter:'Ir a un capítulo',closing:'El cierre alegre',closingDescription:'La orquestación más luminosa trae de vuelta el tema inicial. Las últimas palabras quedan solas; después, la música cierra el cuento.',closingDownload:'Descargar el cierre',comparison:'Comparar los fragmentos musicales',credits:'Créditos de la música',edits:'Música editada para este cuento: fragmentos, fundidos, ecualización, reducción bajo las voces y sincronización con la narración. Las licencias musicales se aplican a la música; el texto y las ilustraciones conservan sus propios derechos.',footer:'La posición de escucha se guarda en este navegador. Las versiones en inglés y español usan las mismas elecciones musicales, sincronizadas con cada narración.',preparing:'Preparando el cuento completo',playing:'Reproduciendo el cuento completo.',resuming:'Listo en tu última posición. Pulsa reproducir para continuar.',error:'No se pudo cargar el audio. Actualiza la página o descarga el MP3.',seekError:'Descarga el MP3 para escuchar y cambiar de capítulo.'}};
function words(){return ui[edition.locale]||ui.en}function key(){return 'soundtrack-picker-position-'+data.title+'-'+edition.locale+'-'+edition.version}
function clock(n){const m=Math.floor(n/60);return m+':'+String(Math.round(n%60)).padStart(2,'0')}
function save(){if(edition&&audio.currentTime>0)try{localStorage.setItem(key(),String(audio.currentTime))}catch{}}
function node(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e}
async function prepare(){if(buffered)return;if(buffering)return buffering;const token=generation;const e=edition;controller=new AbortController();buffering=(async()=>{try{const response=await fetch(e.audio,{credentials:'same-origin',signal:controller.signal});if(!response.ok)throw new Error('Audio unavailable');const total=Number(response.headers.get('Content-Length')||0);let body;if(response.body){const reader=response.body.getReader(),parts=[];let bytes=0;for(;;){const result=await reader.read();if(result.done)break;parts.push(result.value);bytes+=result.value.length;if(token===generation)$('status').textContent=words().preparing+(total?' · '+Math.round(bytes/total*100)+'%':'…')}body=new Blob(parts,{type:'audio/mpeg'})}else body=await response.blob();if(token!==generation)return;const time=requestedTime??audio.currentTime,playing=!audio.paused;blobURL=URL.createObjectURL(body);const ready=new Promise((resolve,reject)=>{audio.addEventListener('loadedmetadata',resolve,{once:true});audio.addEventListener('error',reject,{once:true})});audio.src=blobURL;audio.load();await ready;if(token!==generation)return;buffered=true;audio.currentTime=Math.min(time,audio.duration-.1);if(playing)await audio.play().catch(()=>{});else $('status').textContent=words().resuming}catch(error){if(token===generation){buffering=null;$('status').textContent=words().error}throw error}})();return buffering}
async function seek(time){const token=generation;requestedTime=time;try{await prepare();if(token!==generation)return;audio.currentTime=time;save();await audio.play().catch(()=>{$('status').textContent=words().ready})}catch{if(token===generation)$('status').textContent=words().seekError}finally{if(token===generation)requestedTime=null}}
function select(locale){save();audio.pause();closing.pause();generation++;if(controller)controller.abort();if(blobURL)URL.revokeObjectURL(blobURL);blobURL=null;buffering=null;buffered=false;requestedTime=null;edition=data.editions.find(e=>e.locale===locale)||data.editions[0];const w=words();document.documentElement.lang=edition.locale;document.title=edition.title+' · Soundtrack Picker';$('eyebrow').textContent=data.subtitle||'Soundtrack Picker';$('title').textContent=edition.title;$('intro').textContent=edition.intro||w.intro;$('mix-label').textContent=edition.mix_label||w.mix;$('duration').textContent=clock(edition.duration)+' · '+w.duration;$('download').href=edition.audio;$('download').textContent=w.download;$('restart').textContent=w.restart;$('status').textContent=w.ready;$('chapter-title').textContent=w.chapter;$('closing-title').textContent=edition.closing_title||w.closing;$('closing-description').textContent=edition.closing_description||w.closingDescription;$('closing-download').textContent=w.closingDownload;$('closing-section').hidden=!edition.closing;if(edition.closing){closing.src=edition.closing;$('closing-download').href=edition.closing}audio.src=edition.audio;audio.load();$('chapters').replaceChildren();edition.chapters.forEach(c=>{const b=node('button',c.label);b.type='button';b.onclick=()=>seek(c.start);$('chapters').append(b)});if(edition.closing_start!=null){const b=node('button',w.closing);b.type='button';b.onclick=()=>seek(edition.closing_start);$('chapters').append(b)}document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.language===edition.locale));$('credits-title').textContent=w.credits;$('edit-notice').textContent=w.edits;$('footer').textContent=w.footer;$('comparison').textContent=w.comparison;$('comparison').href=data.comparison_url||'#';$('comparison').hidden=!data.comparison_url;try{localStorage.setItem(languageKey,edition.locale);const saved=Number(localStorage.getItem(key())||0);if(saved>5&&saved<edition.duration-3){requestedTime=saved;prepare().catch(()=>{})}}catch{}if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:edition.title,artist:data.author||'',album:'Soundtrack Picker'});}
data.editions.forEach(e=>{const b=node('button',e.label);b.type='button';b.dataset.language=e.locale;b.onclick=()=>select(e.locale);$('languages').append(b)});data.credits.forEach(c=>{const li=node('li');const a=node('a',c.title+' — '+c.composer);a.href=c.url;li.append(a,document.createTextNode(' · '));const license=node('a',c.license);license.href=c.license_url;li.append(license);$('credits').append(li)});
$('restart').onclick=()=>seek(0);audio.addEventListener('play',()=>{closing.pause();$('status').textContent=words().playing;prepare().catch(()=>{})});closing.addEventListener('play',()=>audio.pause());audio.addEventListener('pause',save);audio.addEventListener('timeupdate',()=>{if(Math.abs(audio.currentTime-lastSave)>5){lastSave=audio.currentTime;save()}});window.addEventListener('pagehide',save);audio.addEventListener('error',()=>{$('status').textContent=words().error});
if('mediaSession'in navigator)for(const [action,handler]of Object.entries({play:()=>audio.play(),pause:()=>audio.pause(),seekbackward:()=>seek(Math.max(0,audio.currentTime-15)),seekforward:()=>seek(Math.min(audio.duration,audio.currentTime+15)),seekto:e=>seek(e.seekTime)}))try{navigator.mediaSession.setActionHandler(action,handler)}catch{}
let initial=new URL(location.href).searchParams.get('lang');if(!initial)try{initial=localStorage.getItem(languageKey)}catch{}select(initial||data.default_locale||data.editions[0].locale);
</script></body></html>
